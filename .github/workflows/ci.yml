name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      macos-required: ${{ steps.scope.outputs.macos-required }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Select macOS CI scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-scope.mjs --event "$EVENT" --base "$BASE" --head "$HEAD"

  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Public package consumer installs
        run: ./test.sh -- npm run check:package-install

  # Tests are split across parallel jobs so the slowest suites do not run back to back.
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: coding-agent
          - name: durable
          - name: other
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Configure Linux backup DNS resolvers
        if: matrix.name != 'durable'
        uses: fitchmultz/.github/.github/actions/setup-linux-dns@508d2e23c75cab8fdd28bc62fc7fed2a9a0d1cca # main

      # fd and ripgrep are used by coding-agent tools tests and tui autocomplete tests.
      - name: Install system dependencies
        if: matrix.name != 'durable'
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends fd-find ripgrep tmux lsof procps
          sudo ln -s "$(command -v fdfind)" /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      # Fork: guard request-time extension dependency resolution in the standalone CLI.
      - name: Setup Bun
        if: matrix.name == 'coding-agent'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Build standalone CLI
        if: matrix.name == 'coding-agent'
        run: |
          ./scripts/build-binaries.sh --skip-install --skip-build \
            --platform linux-x64 --out "$RUNNER_TEMP/pi-compiled"

      - name: Compiled extension packages
        if: matrix.name == 'coding-agent'
        env:
          PI_TEST_COMPILED_CLI: ${{ runner.temp }}/pi-compiled/linux-x64/pi
        run: |
          ./test.sh -- node node_modules/vitest/dist/cli.js --run \
            --root packages/coding-agent test/compiled-extension-packages.test.ts

      - name: Build the pi-env daemon
        if: matrix.name == 'other'
        run: npm run build:daemon --workspace packages/env

      - name: Test
        env:
          SUITE: ${{ matrix.name }}
        run: |
          if [ "$SUITE" != other ]; then
            ./test.sh -- npm run test --workspace "packages/$SUITE"
            exit 0
          fi
          # Every other workspace, so new packages are tested without editing this workflow.
          args=()
          for dir in packages/*/; do
            case "$dir" in packages/coding-agent/ | packages/durable/) continue ;; esac
            args+=(--workspace "${dir%/}")
          done
          ./test.sh -- npm run test:scripts
          ./test.sh -- npm run test --if-present "${args[@]}"

  # Fork: restart, background_command, bash abort and bash timeout depend on macOS process groups, signals and Unix sockets.
  macos-restart-background:
    needs: scope
    if: needs.scope.outputs.macos-required == 'true'
    # Avoid the arm64 capacity constraints behind macos-latest.
    runs-on: macos-26-intel
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install tmux
        run: brew install tmux

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: |
          root="$PWD"
          cd "$(dirname "$root")/$(basename "$root" | tr '[:lower:]' '[:upper:]')"
          npm run build

      - name: Restart, background_command, bash abort and bash timeout tests
        working-directory: packages/coding-agent
        # Vitest takes 3 minutes here on a usual runner and took 9 on the slowest one seen. The limit is
        # three times that, rounded up, so a test process that hangs fails the job instead of holding it.
        timeout-minutes: 30
        # Avoid CPU/I/O contention between the large-journal and launcher subprocess tests. The verbose
        # reporter prints each test and its duration when it ends; the default dot reporter prints
        # nothing until the run ends, which leaves no trace of where a hung or slow run stopped.
        run: ../../test.sh -- node ../../node_modules/vitest/dist/cli.js --run --no-file-parallelism --reporter=verbose --reporter=github-actions restart background-command bash-abort-process-group 11613-bash-timeout-after-shell-exit

      - name: Case-insensitive workspace build and release liveness
        run: ./test.sh -- node --test scripts/workspace-build.test.mjs scripts/fork-release-liveness.test.mjs

  mcp-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Runs pi's MCP client from source against the pinned official conformance suite and fails on
      # regressions against packages/coding-agent/test/mcp-conformance/baseline.json.
      - name: MCP client conformance
        run: npm run test:mcp-conformance
