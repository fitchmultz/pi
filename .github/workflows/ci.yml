name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep tmux
          sudo ln -s "$(command -v fdfind)" /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      # Fork: guard request-time extension dependency resolution in the standalone CLI.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Build standalone CLI
        run: |
          ./scripts/build-binaries.sh --skip-install --skip-build \
            --platform linux-x64 --out "$RUNNER_TEMP/pi-compiled"

      - name: Compiled extension packages
        env:
          PI_TEST_COMPILED_CLI: ${{ runner.temp }}/pi-compiled/linux-x64/pi
        run: |
          ./test.sh -- node node_modules/vitest/dist/cli.js --run \
            --root packages/coding-agent test/compiled-extension-packages.test.ts

      - name: Check
        run: npm run check

      - name: Public package consumer installs
        run: ./test.sh -- npm run check:package-install

      - name: Build the pi-env daemon
        run: npm run build:daemon --workspace packages/env

      - name: Test
        run: ./test.sh

  # Fork: restart and background_command depend on macOS process groups, signals and Unix sockets.
  macos-restart-background:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install tmux
        run: brew install tmux

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: |
          root="$PWD"
          cd "$(dirname "$root")/$(basename "$root" | tr '[:lower:]' '[:upper:]')"
          npm run build

      - name: Restart and background_command tests
        working-directory: packages/coding-agent
        run: node ../../node_modules/vitest/dist/cli.js --run restart background-command

      - name: Case-insensitive workspace build
        run: node --test scripts/workspace-build.test.mjs

  mcp-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Runs pi's MCP client from source against the pinned official conformance suite and fails on
      # regressions against packages/coding-agent/test/mcp-conformance/baseline.json.
      - name: MCP client conformance
        run: npm run test:mcp-conformance
