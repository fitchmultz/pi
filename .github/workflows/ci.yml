name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-full:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install Linux terminal and test prerequisites
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep tmux
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
      - run: npm ci --ignore-scripts
      - run: npm run hydrate:model-data
      - run: npm run verify:fork
      - name: Verification must not regenerate tracked inputs
        run: |
          git diff --exit-code
          git diff --cached --exit-code

  macos-runtime:
    if: github.event_name != 'push'
    runs-on: macos-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install macOS terminal and test prerequisites
        run: |
          for tool in tmux fd ripgrep; do
            brew list "$tool" >/dev/null 2>&1 || brew install "$tool"
          done
      - run: npm ci --ignore-scripts
      - run: npm run hydrate:model-data
      - run: npm run verify:fork -- --suite runtime
      - name: Verification must not regenerate tracked inputs
        run: |
          git diff --exit-code
          git diff --cached --exit-code
